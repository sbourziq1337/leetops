apiVersion: apps/v1
kind: Deployment
metadata:
  name: leetops-deployment
  namespace: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: leetops

  template:
    metadata:
      labels:
        app: leetops

    spec:
      containers:
        - name: leetops
          image: sbourziq/leetops:v1
          ports:
            - containerPort: 80